<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>WebSocket ArrayBuffer Test</title>
	<style>
		body { font: 16px system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
		label, input, button { display: block; margin: .5rem 0; }
		input { width: 100%; box-sizing: border-box; padding: .5rem; }
		button { padding: .5rem .75rem; }
		#status { margin-top: 1rem; white-space: pre-wrap; }
	</style>
</head>
<body>
	<h1>WebSocket ArrayBuffer Test</h1>

	<label for="url">WebSocket URL</label>
	<input id="url" value="https://durable-object-server.21beckem8.workers.dev" placeholder="ws://localhost:8787">
	<button id="connect">Connect</button>

	<button id="start-recording-btn">Start Recording</button>

	<label for="compare-with">Compare with:</label>
	<input id="compare-with" value="">
	<button id="compare-btn" disabled>Compare</button>

	<textarea id="status" readonly style="border: none; width: 100%" rows="5">Disconnected</textarea>
    
    <label for="my-id" style="margin-top: 2rem;">My Durable Object ID:</label>
	<input readonly id="my-id" value="" style="width: 100%;">

	<script type="module">
import { AudioCompare } from "../exports/compare/compare.js";
let analyzer, socket;
async function base64ToBuffer(base64) {
  const res = await fetch(`data:application/octet-stream;base64,${base64}`);
  return await res.arrayBuffer();
}
(async () => {
    window.analyzer = await AudioCompare.fromObject({});
    analyzer = window.analyzer;
})();
const status = document.getElementById('status');
const startRecordingButton = document.getElementById('start-recording-btn');
const connectButton = document.getElementById('connect');
const compareButton = document.getElementById('compare-btn');

function setStatus(message) {
    console.log(message);
    status.textContent = message;
}

connectButton.addEventListener('click', () => {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
        return;
    }

    setStatus('Connecting...');
    window.socket = new WebSocket(document.getElementById('url').value);
    socket = window.socket;
    socket.binaryType = 'arraybuffer';

    socket.addEventListener('open', () => {
        setStatus('Connected');
        connectButton.textContent = 'Disconnect';
        compareButton.disabled = false;
    });

    socket.addEventListener('message', event => {
        try {
            const data = JSON.parse(event.data);
            if (data.type === 'connected') {
                document.getElementById('my-id').value = data.id;
            }
            setStatus(JSON.stringify(data, null, 2));
        } catch (e) {
            console.error('Error parsing message:', e);
        }
    });

    socket.addEventListener('error', () => setStatus('WebSocket error'));
    socket.addEventListener('close', () => {
        setStatus('Disconnected');
        connectButton.textContent = 'Connect';
        compareButton.disabled = true;
    });
});

compareButton.addEventListener('click', () => {
    socket.send(`{"type":"compare", "with": "${document.getElementById('compare-with').value}"}`);
    setStatus('Sent compare command');
});
startRecordingButton.addEventListener('click', async () => {
    if (!analyzer)
        return setStatus('Analyzer not initialized');

    if (startRecordingButton.textContent === 'Start Recording') {
        await analyzer.pipeMicAudio({
            onPacket: (packet) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(packet.buffer);
                }
            },
        });
        startRecordingButton.textContent = 'Stop Recording';
        setStatus('Recording started');
    } else {
        await analyzer.stopMicAudio();
        startRecordingButton.textContent = 'Start Recording';
        setStatus('Recording stopped');
        analyzer.reset();
    }
});
	</script>
</body>
</html>
